seed: 42
data_dir: data/processed
run_dir: runs/repro3_main
model:
  dim: 768
  depth: 12
  heads: 12
  mlp_ratio: 4.0
  swiglu_convention: param_matched
  context_tokens: 32
  context_start: 3
  drop_prob: 0.1
  value_hidden: 768
  time_dim: 256
  time_scale: 1.0
  pos_encoding: true
  batch_condition: true
  cell_init_std: 1.0
  batch_init_std: 0.02
  grad_checkpoint: false
  position_scale: 1.0
  gene_proj_init_scale: 1.0
  null_condition_init: zero
training:
  epochs: 55
  min_epochs: 20
  early_stop_patience_epochs: 10
  early_stop_min_delta: 0.002
  warmup_epochs: 5
  micro_batch: 16
  effective_batch: 512
  lr: 0.0001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.0
  noise_std: 0.75
  p_mean: -0.8
  p_std: 0.8
  ema_decays:
  - 0.9999
  - 0.9996
  compile: true
  compile_mode: default
  data_on_gpu: false
  train_subset: null
  checkpoint_steps: 50
  log_steps: 5
  val_cells: 1024
  val_interval_steps: 250
  val_generation_epochs: 5
  val_generation_cap: 32
  val_generation_steps: 50
  val_generation_batch: 32
  diagnostic_generation_epochs: []
  diagnostic_generation_cap: 8
  max_grad_norm: null
  distributed_generation: true
  generation_mse_weight: 10.0
sampling:
  steps: 50
  guidance: 1.5
  cfg_min: 0.1
  cfg_max: 0.9
  clamp: true
