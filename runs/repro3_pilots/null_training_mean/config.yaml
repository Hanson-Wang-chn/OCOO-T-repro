seed: 42
data_dir: data/processed
run_dir: runs/repro3_pilots/null_training_mean
model:
  dim: 768
  depth: 12
  heads: 12
  mlp_ratio: 4.0
  swiglu_convention: param_matched
  context_tokens: 32
  context_start: 3
  drop_prob: 0.1
  value_hidden: 768
  time_dim: 256
  time_scale: 1.0
  pos_encoding: true
  batch_condition: true
  cell_init_std: 1.0
  batch_init_std: 0.02
  grad_checkpoint: false
  position_scale: 1.0
  gene_proj_init_scale: 1.0
  null_condition_init: training_mean
training:
  epochs: 48
  warmup_epochs: 5
  micro_batch: 16
  effective_batch: 512
  lr: 0.0001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.0
  noise_std: 1.0
  p_mean: -0.8
  p_std: 0.8
  ema_decays:
  - 0.9999
  - 0.9996
  compile: true
  compile_mode: default
  data_on_gpu: false
  train_subset: 16384
  checkpoint_steps: 64
  log_steps: 10
  val_cells: 384
  val_interval_steps: 128
  val_generation_epochs: 48
  val_generation_cap: 16
  val_generation_steps: 50
  val_generation_batch: 32
  diagnostic_generation_epochs: []
  diagnostic_generation_cap: 8
  max_grad_norm: null
  distributed_generation: true
  generation_weights: ema
sampling:
  steps: 50
  guidance: 1.5
  cfg_min: 0.0
  cfg_max: 1.0
  clamp: true
