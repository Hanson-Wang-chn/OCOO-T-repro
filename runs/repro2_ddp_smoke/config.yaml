  - 0.95
  weight_decay: 0.0
  ema_decays:
  - 0.9999
  - 0.9996
  noise_std: 1.0
  p_mean: -0.8
  p_std: 0.8
  compile: false
  train_subset: null
  checkpoint_steps: 1
  log_steps: 1
  val_cells: 2
  val_interval_steps: 1
  val_generation_epochs: 1
  val_generation_cap: 1
  val_generation_steps: 50
  val_generation_batch: 1
  distributed_generation: true
sampling:
  steps: 50
  guidance: 1.5
  cfg_min: 0.1
  cfg_max: 0.9
  clamp: true
