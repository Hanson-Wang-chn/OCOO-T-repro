[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocoot-reproduction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch==2.8.0", "numpy", "scipy", "pandas", "h5py", "anndata", "scanpy", "pyyaml", "requests", "zstandard"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

