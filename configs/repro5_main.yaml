# OCOO-T Replogle–Nadig 第五轮全量复现配置。
# 本配置严格忠于 OCOO-T v2 原论文核心算法（Rectified Flow v-prediction、
# logit-normal(-0.8, 0.8)、双条件 Eq.11 CFG、AdamW 零 weight decay、
# effective_batch=512、lr=1e-4、5 轮 warmup + cosine 至 0、双 EMA 默认 0.9996、
# 50 步 Heun + 末步 Euler），并纳入第四轮已验证的关键纠偏：
#   1. cell_init_std=0.02（恢复 JiT 标准，替代错误的 1.0）
#   2. batch_condition=false（忠于论文 Fig.1/§3.4，不在 Replogle 注入并放大 batch）
#   3. JiT 中间六层 attn_drop=proj_drop=0.1（缓解 weight_decay=0 下 E30 后过拟合）
#   4. position_scale=0.1（保留 Fig.1 位置编码，避免初始幅度淹没表达与 ESM2 语义）
#   5. epochs=80（对齐论文 Fig.5），周期验证使用更合理的 CFG (w=1.15, [0.0, 0.85])
#      并附带每 10 轮无引导诊断及 step>=12000 的 4% EMA 健康熔断。
seed: 42
data_dir: data/processed
run_dir: runs/repro5_main
model:
  dim: 768
  depth: 12
  heads: 12
  mlp_ratio: 4.0
  swiglu_convention: param_matched
  context_tokens: 32
  context_start: 3
  drop_prob: 0.1
  value_hidden: 768
  time_dim: 256
  time_scale: 1.0
  pos_encoding: true
  batch_condition: false
  cell_init_std: 0.02
  batch_init_std: 0.02
  grad_checkpoint: false
  pert_projection: shared
  position_scale: 0.1
  gene_proj_init_scale: 1.0
  null_condition_init: zero
  attn_drop: 0.1
  proj_drop: 0.1
  dropout_layer_policy: jit_middle
  condition_dropout_mode: independent
training:
  epochs: 80
  min_epochs: 35
  early_stop_patience_epochs: 15
  early_stop_min_delta: 0.002
  warmup_epochs: 5
  micro_batch: 16
  effective_batch: 512
  lr: 0.0001
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.0
  noise_std: 0.75
  p_mean: -0.8
  p_std: 0.8
  ema_decays:
  - 0.9999
  - 0.9996
  compile: true
  compile_mode: default
  data_on_gpu: false
  train_subset: null
  checkpoint_steps: 50
  log_steps: 5
  val_cells: 1024
  val_interval_steps: 250
  val_generation_epochs: 5
  val_generation_cap: 32
  val_generation_steps: 50
  val_generation_batch: 32
  val_unguided_epochs: 10
  diagnostic_generation_epochs: []
  diagnostic_generation_cap: 8
  max_grad_norm: null
  max_ema_endpoint_relative_gap: 0.04
  ema_health_min_step: 12000
  distributed_generation: true
  generation_mse_weight: 10.0
sampling:
  steps: 50
  guidance: 1.15
  cfg_min: 0.0
  cfg_max: 0.85
  clamp: true
